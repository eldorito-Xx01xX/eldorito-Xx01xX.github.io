<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open Android Settings</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding: 2rem; color:#111; }
    .btn { display:inline-block; padding:.75rem 1.25rem; background:#0b63d6; color:#fff; border-radius:8px; text-decoration:none; cursor:pointer; }
    #status { margin-top:1rem; color:#333; font-weight:600; }
    .hint { margin-top:.5rem; color:#555; }
  </style>
</head>
<body>
  <h3>Open Android Settings</h3>

  <p>Tap the button below to attempt to open the Android Settings app from your browser.</p>

  <button id="openBtn" class="btn">Open Settings</button>

  <div id="status">Status: ready</div>
  <div class="hint">If nothing happens, open Settings manually from your device.</div>

  <script>
    const status = document.getElementById('status');
    const btn = document.getElementById('openBtn');

    // Primary intent to open the main Settings screen
    const INTENT_PRIMARY = 'intent:#Intent;action=android.settings.SETTINGS;end';

    // Alternative intent variants for different browser behaviors
    const INTENT_VARIANTS = [
      'intent:#Intent;action=android.settings.SETTINGS;end',
      'intent://settings/#Intent;action=android.settings.SETTINGS;end',
      'intent://#Intent;action=android.settings.SETTINGS;end',
      // Direct package open attempt
      'intent:#Intent;component=com.android.settings/.Settings;end'
    ];

    // Try to navigate to a URI and wait briefly to allow the OS to handle it
    function tryNavigate(uri, wait = 1000) {
      return new Promise((resolve) => {
        try {
          window.location = uri;
        } catch (e) {
          console.error('Navigation error', e);
        }
        setTimeout(() => resolve(), wait);
      });
    }

    async function openSettings() {
      status.textContent = 'Status: attempting to open Settings';
      // Try each variant in sequence
      for (let i = 0; i < INTENT_VARIANTS.length; i++) {
        const uri = INTENT_VARIANTS[i];
        await tryNavigate(uri, 900);
        // short pause between attempts
        await new Promise(r => setTimeout(r, 300));
      }

      // Final fallback: try the generic settings action via location.href
      status.textContent = 'Status: attempts finished. If Settings did not open, please open Settings manually.';
    }

    btn.addEventListener('click', () => {
      // Must be a user gesture for many browsers to allow intent navigation
      openSettings().catch(err => {
        console.error(err);
        status.textContent = 'Status: error occurred. Please open Settings manually.';
      });
    });
  </script>
</body>
</html>
